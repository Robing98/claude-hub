[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hub"
version = "0.1.0"
description = "Self-hosted hub that collects and organizes Claude work across machines"
requires-python = ">=3.10"
# The collector runs on every machine, so the base install stays minimal:
# no dependencies on Python 3.11 or later, and one TOML reader on 3.10.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
claude-hub = "claude_hub.server.cli:main"
claude-hub-collector = "claude_hub.collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
